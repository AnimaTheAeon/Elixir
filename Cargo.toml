[package]
name = "elixir"
version = "1.2.1"
edition = "2021"
description = "Elixir: renames TV shows, movies and anime using TheMovieDB, TheTVDB and AniDB."
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "elixir"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
unicode-normalization = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_IO", "Win32_System_Time"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
